<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Supabase anon-key test</title></head>
<body style="font-family:monospace; padding:20px; font-size:14px;">
<h3>Testing frontend (anon key) write to profiles...</h3>
<pre id="out">Running...</pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://pkflpvufgkvncngjefzp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Pas0Sz8bTozRSMXg3PdaVg_7LT6N2wB";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const out = document.getElementById("out");

(async () => {
  const testId = "dbtest-" + Date.now();
  const { data, error } = await sb.from("profiles").insert({
    id: testId,
    role: "apprentice",
    name: "Frontend Test",
    email: "frontend-test-" + Date.now() + "@example.com"
  }).select("*");

  if (error) {
    out.textContent = "❌ INSERT FAILED\n\n" + JSON.stringify(error, null, 2);
    return;
  }

  out.textContent = "✅ INSERT SUCCEEDED\n\n" + JSON.stringify(data, null, 2);

  // Clean up
  await sb.from("profiles").delete().eq("id", testId);
})();
</script>
</body>
</html>
